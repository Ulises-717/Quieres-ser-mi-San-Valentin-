<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Andy ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
font-family:'Segoe UI',sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

/* FOTO DE FONDO */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("nosotros.jpg") center/cover no-repeat;
z-index:-2;
}

/* Capa oscura elegante */
body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* Contenedor */
.container{
animation:fadeIn 2s ease-in-out;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

h1{
font-size:3em;
margin-bottom:15px;
}

button{
padding:15px 30px;
font-size:18px;
margin:10px;
background:white;
color:#ff4e8d;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* Cuenta regresiva */
#countdown{
margin-top:10px;
font-size:1.2em;
}

/* Fuegos artificiales */
.firework{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
animation:explode 1s ease-out forwards;
}

@keyframes explode{
0%{transform:scale(1);}
100%{transform:scale(20);opacity:0;}
}
</style>
</head>

<body>

<div class="container" id="contenido">
<h1 id="typing"></h1>

<p>¿Aceptas ser mi San Valentín? 💕</p>

<button onclick="acepto()">Sí ❤️</button>
<button onclick="acepto()">Obvio que sí 😏</button>

<div id="countdown"></div>
</div>

<script>

/* MAQUINA DE ESCRIBIR */
const text = "Andy ❤️";
let i=0;
function typeWriter(){
if(i < text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typeWriter,150);
}
}
typeWriter();

/* CUENTA REGRESIVA (24 horas) */
const targetDate = new Date();
targetDate.setHours(targetDate.getHours()+24);

function updateCountdown(){
const now = new Date();
const diff = targetDate - now;

const h = Math.floor(diff/1000/60/60);
const m = Math.floor(diff/1000/60)%60;
const s = Math.floor(diff/1000)%60;

document.getElementById("countdown").innerHTML =
"Tiempo para nuestra próxima historia juntos: " + h + "h " + m + "m " + s + "s";
}
setInterval(updateCountdown,1000);

/* Fuegos artificiales */
function firework(){
for(let i=0;i<40;i++){
let fw=document.createElement("div");
fw.classList.add("firework");
fw.style.left=Math.random()*100+"vw";
fw.style.top=Math.random()*100+"vh";
fw.style.background=`hsl(${Math.random()*360},100%,60%)`;
document.body.appendChild(fw);
setTimeout(()=>fw.remove(),1000);
}
}

/* Cuando acepta */
function acepto(){
firework();
document.getElementById("contenido").innerHTML = `
<h1>Feliz San Valentín Andy 💖</h1>
<p>Desde que bailamos juntos supe que eras especial...</p>
<p>Quiero seguir escribiendo esta historia contigo 💃🕺</p>
<a href="https://wa.me/5212461718431?text=Si%20quiero%20seguir%20bailando%20contigo%20❤️">
<button>Responder por WhatsApp 💌</button>
</a>
`;
}

</script>

</body>
</html>
