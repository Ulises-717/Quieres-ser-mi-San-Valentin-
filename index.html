<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Andy ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

/* FOTO DE FONDO */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("nosotros.png") center/cover no-repeat;
z-index:-2;
}

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* CONTENIDO */
.container{
text-align:center;
animation:fadeIn 2s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

h1{
font-size:3em;
margin-bottom:20px;
}

button{
padding:15px 30px;
font-size:18px;
margin:10px;
background:white;
color:#ff4e8d;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* CARTA */
.letter{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
width:320px;
background:#fff;
color:#333;
padding:25px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,0.5);
z-index:10;
transition:0.6s ease;
}

.letter.open{
transform:translate(-50%,-50%) scale(1);
}

.letter h2{
margin-bottom:10px;
color:#ff4e8d;
}

/* FUEGOS ARTIFICIALES */
canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container" id="contenido">
<h1 id="typing"></h1>
<p>¿Aceptas ser mi San Valentín? 💕</p>
<button onclick="acepto()">Sí ❤️</button>
<button onclick="acepto()">Obvio que sí 😏</button>
</div>

<div class="letter" id="carta">
<h2>Para Andy 💌</h2>
<p>
Desde que bailamos juntos supe que algo especial estaba empezando...  
No fue solo el ritmo, fue tu sonrisa, tu mirada y la forma en que conectamos.  
Quiero seguir escribiendo esta historia contigo. 💃🕺  
</p>
<br>
<a href="https://wa.me/5212461718431?text=Si%20quiero%20seguir%20bailando%20contigo%20❤️">
<button>Responder 💖</button>
</a>
</div>

<script>

/* MAQUINA DE ESCRIBIR */
const text="Andy ❤️";
let i=0;
function typeWriter(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(typeWriter,150);
}
}
typeWriter();

/* FUEGOS ARTIFICIALES PRO */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function createFirework(x,y){
for(let i=0;i<80;i++){
particles.push({
x:x,
y:y,
angle:Math.random()*2*Math.PI,
speed:Math.random()*5+2,
radius:2,
life:100,
color:`hsl(${Math.random()*360},100%,60%)`
});
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach((p,index)=>{
p.x+=Math.cos(p.angle)*p.speed;
p.y+=Math.sin(p.angle)*p.speed;
p.life--;
ctx.beginPath();
ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();
if(p.life<=0){
particles.splice(index,1);
}
});
requestAnimationFrame(animate);
}
animate();

function acepto(){
createFirework(canvas.width/2,canvas.height/2);
setTimeout(()=>{
document.getElementById("carta").classList.add("open");
},800);
}

</script>

</body>
</html>
