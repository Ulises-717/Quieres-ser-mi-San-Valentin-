<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Andy ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
background:black;
}

/* FOTO HD */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("nosotros.png") center center / cover no-repeat;
background-attachment:fixed;
image-rendering: auto;
z-index:-3;
}

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:-2;
}

/* CONTENIDO */
.container{
text-align:center;
z-index:5;
animation:fadeIn 2s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

h1{
font-size:3em;
margin-bottom:20px;
text-shadow:0 0 20px rgba(255,255,255,0.6);
}

button{
padding:15px 30px;
font-size:18px;
margin:10px;
background:white;
color:#ff4e8d;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* CARTA */
.letter{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scaleY(0);
transform-origin:top;
width:340px;
background:#fff;
color:#333;
padding:25px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.6);
z-index:20;
transition:0.7s ease;
}

.letter.open{
transform:translate(-50%,-50%) scaleY(1);
}

.letter h2{
margin-bottom:10px;
color:#ff4e8d;
}

/* BRILLOS MAGICOS */
.sparkle{
position:absolute;
width:6px;
height:6px;
background:white;
border-radius:50%;
box-shadow:0 0 15px white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.3;transform:scale(0.5);}
to{opacity:1;transform:scale(1.5);}
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
z-index:10;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<audio id="music">
<source src="https://www.dropbox.com/scl/fi/pckd37iharc9wvqs6fwn6/VEN-DEV-RAME-OTRA-VEZ-Guaynaa-Visualizer.m4a?rlkey=ihn4fe2lnmsvd7nwdfikvu7nj&st=ydm1zffp&dl=0" type="audio/mp3">
</audio>

<div class="container" id="contenido">
<h1 id="typing"></h1>
<p>¿Aceptas ser mi San Valentín? 💕</p>
<button onclick="acepto()">Sí ❤️</button>
<button onclick="acepto()">Obvio que sí 😏</button>
</div>

<div class="letter" id="carta">
<h2>Para Andy 💌</h2>
<p>
Desde que bailamos juntos supe que eras diferente…  
No fue solo el ritmo, fue la conexión.  
Quiero seguir escribiendo esta historia contigo. 💃🕺  
</p>
<br>
<a href="https://wa.me/5212461718431?text=Si%20quiero%20seguir%20bailando%20contigo%20❤️">
<button>Responder 💖</button>
</a>
</div>

<script>

/* MAQUINA DE ESCRIBIR */
const text="Andy ❤️";
let i=0;
function typeWriter(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(typeWriter,150);
}
}
typeWriter();

/* BRILLOS MAGICOS */
function createSparkle(){
let s=document.createElement("div");
s.className="sparkle";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
setTimeout(()=>s.remove(),2000);
}
setInterval(createSparkle,300);

/* FUEGOS ARTIFICIALES DISNEY FULL */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function createFirework(x,y){
for(let i=0;i<150;i++){
particles.push({
x:x,
y:y,
angle:Math.random()*2*Math.PI,
speed:Math.random()*7+2,
radius:2,
life:120,
color:`hsl(${Math.random()*360},100%,60%)`
});
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach((p,index)=>{
p.x+=Math.cos(p.angle)*p.speed;
p.y+=Math.sin(p.angle)*p.speed;
p.life--;
ctx.beginPath();
ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();
if(p.life<=0){particles.splice(index,1);}
});
requestAnimationFrame(animate);
}
animate();

function acepto(){
for(let i=0;i<5;i++){
setTimeout(()=>{
createFirework(Math.random()*canvas.width,Math.random()*canvas.height);
},i*400);
}

/* Abrir carta */
setTimeout(()=>{
document.getElementById("carta").classList.add("open");
document.getElementById("music").play();
},800);
}

</script>

</body>
</html>
