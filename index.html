<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andy ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
min-height:100dvh;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
background:black;
padding:20px;
}

/* FOTO HD OPTIMIZADA */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("nosotros.jpeg") center center / cover no-repeat;
z-index:-3;
}

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-2;
}

/* CONTENIDO */
.container{
text-align:center;
z-index:5;
width:100%;
max-width:500px;
margin:auto;
animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

h1{
font-size:clamp(2.2rem, 6vw, 3rem);
margin-bottom:20px;
text-shadow:0 0 25px rgba(255,255,255,0.8);
}

p{
font-size:clamp(1.1rem, 4vw, 1.3rem);
margin-bottom:20px;
}

button{
width:100%;
max-width:320px;
padding:15px;
font-size:18px;
margin:10px auto;
background:white;
color:#ff4e8d;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
display:block;
}

button:hover{
transform:scale(1.05);
}

/* CARTA MEJORADA */
.letter{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
width:92%;
max-width:420px;
background:#fff;
color:#333;
padding:25px;
border-radius:20px;
box-shadow:0 25px 60px rgba(0,0,0,0.7);
z-index:30;
transition:0.6s cubic-bezier(.68,-0.55,.27,1.55);
}

.letter.open{
transform:translate(-50%,-50%) scale(1);
}

.letter h2{
margin-bottom:15px;
color:#ff4e8d;
font-size:1.6rem;
}

/* BRILLOS MAGICOS */
.sparkle{
position:absolute;
width:6px;
height:6px;
background:white;
border-radius:50%;
box-shadow:0 0 15px white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.3;transform:scale(0.5);}
to{opacity:1;transform:scale(1.6);}
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
z-index:10;
}

/* EXTRA AJUSTE MOVIL */
@media (max-width:480px){

body{
padding:15px;
}

button{
font-size:17px;
}

.letter{
padding:20px;
}

}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<audio id="music" preload="auto">
<source src="https://www.dropbox.com/scl/fi/pckd37iharc9wvqs6fwn6/VEN-DEV-RAME-OTRA-VEZ-Guaynaa-Visualizer.m4a?rlkey=ihn4fe2lnmsvd7nwdfikvu7nj&raw=1" type="audio/mp4">
</audio>

<div class="container" id="contenido">
<h1 id="typing"></h1>
<p>¿Aceptas ser mi San Valentín? 💕</p>
<button onclick="acepto()">Sí ❤️</button>
<button onclick="acepto()">Obvio que sí 😏</button>
</div>

<div class="letter" id="carta">
<h2>Para Andy 💌</h2>
<p>
Desde que bailamos juntos supe que algo especial estaba empezando...  
No fue solo el ritmo, fue tu sonrisa, tu mirada y la forma en que conectamos.  
Quiero seguir escribiendo esta historia contigo. 💃🕺   
</p>
<br>
<a href="https://wa.me/5212461718431?text=Si%20quiero%20seguir%20bailando%20contigo%20❤️">
<button>Responder 💖</button>
</a>
</div>

<script>

/* MAQUINA DE ESCRIBIR */
const text="Andy ❤️";
let i=0;
function typeWriter(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(typeWriter,120);
}
}
typeWriter();

/* BRILLOS MAGICOS */
function createSparkle(){
let s=document.createElement("div");
s.className="sparkle";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
setTimeout(()=>s.remove(),2000);
}
setInterval(createSparkle,400);

/* FUEGOS OPTIMIZADOS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles=[];

function createFirework(x,y){
for(let i=0;i<120;i++){
particles.push({
x:x,
y:y,
angle:Math.random()*2*Math.PI,
speed:Math.random()*6+2,
radius:2,
life:100,
color:`hsl(${Math.random()*360},100%,60%)`
});
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach((p,index)=>{
p.x+=Math.cos(p.angle)*p.speed;
p.y+=Math.sin(p.angle)*p.speed;
p.life--;
ctx.beginPath();
ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();
if(p.life<=0){particles.splice(index,1);}
});
requestAnimationFrame(animate);
}
animate();

function acepto(){

for(let i=0;i<6;i++){
setTimeout(()=>{
createFirework(Math.random()*canvas.width,Math.random()*canvas.height/1.5);
},i*350);
}

setTimeout(()=>{
document.getElementById("carta").classList.add("open");
document.getElementById("music").play();
},700);
}

</script>

</body>
</html>
